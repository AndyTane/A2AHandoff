[package]
name = "a2a-ui-windows"
version = "0.2.2"
edition = "2021"

[[bin]]
name = "A2AHandoff"
path = "src/main.rs"

[dependencies]
handoff-core = { path = "../handoff-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"
] }
